<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Open Graph Dinâmico / Padrão (será atualizado via JS) -->
  <title id="meta-title">PLURIVERSIDADE — Festa Universitária</title>
  <meta name="description" id="meta-desc" content="Confira todas as informações, horários, ingressos e comissários desta festa universitária na Pluriversidade.">
  
  <meta property="og:title" id="og-title" content="PLURIVERSIDADE — Festa Universitária">
  <meta property="og:description" id="og-desc" content="Confira todas as informações, horários, ingressos e comissários desta festa universitária.">
  <meta property="og:image" id="og-image" content="">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="css/estilo.css">
  <style>
    /* Ajuste para garantir que o layout preencha a altura total da tela e fixe o rodapé em baixo se o conteúdo for curto */
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .miolo {
      flex: 1 0 auto;
    }
    .rodape {
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="miolo">
    <!-- CAPA DO SITE (TOPO) -->
    <header class="capa" id="topo-site">
      <div class="topo-video-container">
        <video class="topo-video" src="https://pluriversidade.github.io/pluri/img/video-topo-site.mp4" autoplay muted loop playsinline></video>
        <div class="efeito-tv"></div>
      </div>
      <div class="marca">
        <a href="index.html" style="text-decoration: none; color: inherit;">
          <img class="emblema" src="https://pluriversidade.github.io/pluri/img/LOGO-PLURI-02.png" alt="Emblema Pluriversidade">
          <h1 class="titulo">PLURIVERSIDADE</h1>
        </a>
        <p class="subtitulo" data-texto="subtitulo">grupos de WhatsApp e festas universitárias</p>
      </div>
    </header>

    <!-- CONTEÚDO DETALHADO DA FESTA -->
    <main class="secao" style="margin-top: 2rem;">
      <div style="margin-bottom: 1rem;">
        <a href="index.html" class="festa__link" style="display: inline-flex; width: auto; align-items: center; gap: .4rem;">← Voltar para todas as festas</a>
      </div>

      <div id="detalhe-festa-container">
        <!-- Injetado dinamicamente via JavaScript -->
        <p style="text-align: center; color: var(--tinta-fraca); padding: 2rem;">Carregando informações da festa...</p>
      </div>
    </main>
  </div>

  <!-- RODAPÉ DO SITE -->
  <footer class="rodape">
    <div class="rodape__texto">
      <div class="rodape__direitos">
        <span class="rodape__marca">Pluriversidade</span>
        <span class="rodape__subdireitos">© 2026 • Todos os direitos reservados</span>
      </div>
      <p>Contato via WhatsApp: <a href="https://wa.me/5531991579687" target="_blank" rel="noopener">(31) 99157-9687</a></p>
    </div>
  </footer>

  <!-- SCRIPTS DE DADOS E FUNCIONAMENTO -->
  <script src="js/dados-textos.js"></script>
  <script src="js/dados-grupos.js"></script>
  <script src="js/dados-festas.js"></script>
  <script src="js/dados-parceiros.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Inicialização específica para a página de detalhes da festa
    window.addEventListener("DOMContentLoaded", function () {
      if (typeof montarDetalheFesta === "function") {
        montarDetalheFesta();
      }
    });
  </script>
</body>
</html>
